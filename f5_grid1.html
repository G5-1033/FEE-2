<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta author="author" content="user" />
    <title>Grid Layout</title>
    <link rel="stylesheet" href="" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            font-family: "Segoe UI", sans-serif;
            font-size: 16 px;
            background-color: rgb(199, 178, 178);
            color: rgb(254, 252, 250);
        }
        
        .box {
            background-color: rgb(22, 7, 69);
            color: rgb(254, 252, 250);
            padding: 1rem;
        }
        
        .gc {
            display: grid;
            gap: 0.5rem;
            grid-template-columns: 150px 250px;
            grid-template-rows: repeat(3, 150px);
            place-content: center;
        }
        
        @media (min-width: 767px) {
            .gc {
                grid-template-columns: 200px 200px 200px;
                grid-template-rows: 200px 200px;
            }
        }
        
        @media (min-width: 1024px) {
            .gc {
                grid-template-columns: repeat(4, 250px);
                grid-template-rows: repeat(2, 250px);
            }
            #m6 {
                grid-column: 2 / -1;
            }
        }
    </style>
</head>

<body>
    <section class="box" style="height:10vh">
        <span style="font-size:2.5rem; margin-right:1rem">&#9812 </span> Header/NavBar
    </section>
    <section class="box gc" style="height:80vh; background-color:rgb(209, 191, 191);">
        <main class="box" id="m1">Content 1</main>
        <main class="box" id="m2">Content 2</main>
        <main class="box" id="m3">Content 3</main>
        <main class="box" id="m4">Content 4</main>
        <main class="box" id="m5">Content 5</main>
        <main class="box" id="m6">Content 6</main>
    </section>
    <section class="box" style="position:absolute; bottom:0; left:0; width:100%; height:10vh; background-color:rgb(22, 7, 69);">
        <span style="font-size:1.5rem; margin-left:1rem">&#9776 </span> Footer
    </section>

</body>

</html>
