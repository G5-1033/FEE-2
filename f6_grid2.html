<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courgette&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Courgette", cursive;
            background: #f4f4f4;
        }
        /* Header */
        
        header {
            height: 70px;
            background: #190668;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 25px;
            font-size: 25px;
        }
        /* Main Grid */
        
        .container {
            width: 900px;
            margin: 30px auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: 170px 170px 170px;
            gap: 15px;
        }
        /* Boxes */
        
        .box {
            background: #190668;
            color: white;
            font-size: 28px;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, .2);
        }
        /* Grid Positions */
        
        #m1 {
            grid-column: 1 / 3;
        }
        
        #m2 {
            grid-column: 3 / 4;
            grid-row: 1 / 3;
        }
        
        #m3 {
            grid-column: 1 / 2;
            grid-row: 2 / 4;
        }
        
        #m4 {
            grid-column: 2 / 3;
            grid-row: 2 / 3;
        }
        
        #m5 {
            grid-column: 2 / 4;
            grid-row: 3 / 4;
        }
        /* Footer */
        
        footer {
            margin-top: 30px;
            height: 70px;
            background: #190668;
            color: white;
            display: flex;
            align-items: center;
            padding-left: 25px;
            font-size: 25px;
        }
    </style>

</head>

<body>

    <header>
        ★&nbsp;&nbsp;Header / NavBar
    </header>

    <div class="container">

        <div class="box" id="m1">Content-1</div>

        <div class="box" id="m2">Content-2</div>

        <div class="box" id="m3">Content-3</div>

        <div class="box" id="m4">Content-4</div>

        <div class="box" id="m5">Content-5</div>

    </div>

    <footer>
        Footer
    </footer>

</body>

</html>
