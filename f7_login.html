<!DOCTYPE html>
<html>

<head>
    <title>Login Form</title>
    <style>
        body {
            background-color: #e6f2ff;
            font-family: Arial;
        }
        
        form {
            width: 300px;
            margin: 100px auto;
            padding: 20px;
            background-color: white;
            border: 2px solid #4a90e2;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
            text-align: center;
        }
        
        h2 {
            color: #4a90e2;
        }
        
        input[type="text"],
        input[type="password"] {
            width: 90%;
            padding: 8px;
            margin: 8px 0;
            border: 1px solid gray;
            border-radius: 5px;
        }
        
        input[type="submit"] {
            background-color: #4a90e2;
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        input[type="submit"]:hover {
            background-color: #357abd;
        }
    </style>
</head>

<body>

    <form>
        <h2>Login Form</h2>

        Email<br>
        <input type="text" placeholder="Enter your email"><br> Password

        <br>
        <input type="password" placeholder="Enter your Password"><br><br>

        <input type="submit" value="Login">
    </form>

</body>

</html>
