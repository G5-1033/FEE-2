<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta author="author" content="user" />
    <title>Flex Box</title>
    <link rel="stylesheet" href="" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            font-family: "times new roman", sans-serif;
            font-size: 20 px;
            background-color: rgb(199, 178, 178);
            color: rgb(254, 252, 250);
        }
        
        section {
            padding: 10px;
        }
        
        .box {
            background-color: rgb(74, 30, 30);
        }
        
        .fc {
            display: flex;
            gap: 10px;
            flex-direction: row;
            /* justify-content:flex-start; */
            /* justify-content:flex-end; */
            justify-content: center;
            /* align-items:flex-start; */
            /* align-items:flex-end; */
            align-items: center;
        }
    </style>
</head>

<body>
    <section class="box" style="height:10vh">Header/NavBar</section>
    <section class="fc" style="height:80vh; background-color:rgb(209, 191, 191);">
        <main class="box" style="height:150px; width:200px; padding:10px">Main 1</main>
        <main class="box" style="height:150px; width:200px; padding:10px">Main 2</main>
    </section>
    <section class="box" style="position:absolute; bottom:0; left:0; width:100%; height:10vh; background-color:rgb(74, 30, 30);">
        Footer
</body>
